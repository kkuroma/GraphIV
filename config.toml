# GraphIV global configuration. Local configurations live in benchmarks/config.toml

# Database
[database]
PG_DEST = "host=.pg port=5433 dbname=arxivkg" # connection string of the store

# Source URLs
[source]
SOURCE_URL = "https://www.kaggle.com/api/v1/datasets/download/Cornell-University/arxiv" # Kaggle arXiv snapshot
SOURCE_PATH = "data/arxiv.json" # snapshot on disk
PDF_BASE_URL = "https://storage.googleapis.com/arxiv-dataset/arxiv/arxiv/pdf" # bulk PDF mirror
PDF_LEGACY_BASE_URL = "https://storage.googleapis.com/arxiv-dataset/arxiv" # bulk PDF mirror for old slash ids
HTML_BASE_URL = "https://arxiv.org/html" # arXiv HTML
HTML_FALLBACK_URL = "https://ar5iv.labs.arxiv.org/html" # ar5iv HTML when arXiv has none

# Download Settings
[download]
PDF_BATCH = 500 # papers per PDF batch
PDF_N_PARALLEL = 8 # PDF downloads at once
HTML_RATE = 8.0 # HTML requests per second
HTML_BATCH = 200 # papers per HTML batch
HTML_N_PARALLEL = 16 # HTML downloads at once

# Storage Paths
[dataset]
PDF_PATH = "data/arxiv/pdfs" # downloaded PDFs
HTML_PATH = "data/arxiv/html" # downloaded HTML
GRAPH_PATH = "data/citation_graph_export.npy" # citation graph export

# MCP Server and Library
[serve]
HOST = "127.0.0.1" # address both servers bind
API_PORT = 6767 # port of the tool server
FRONTEND_PORT = 6969 # port of the dashboard
ALLOWED_HOSTS = [] # hosts the HTTP transport answers to (empty means loopback only)
RECIPE_PATH = "retrieval_recipes" # directory of the mode recipes
RUNS_PATH = "data/runs" # where each report is written
CACHE_PATH = "data/cache" # model replies cached by prompt
FETCH = true # fetch a paper the corpus lacks
PDFTOTEXT = "pdftotext" # pdf text extractor

# Retrieval
[retrieve]
COSINE_LIMIT = 5000 # papers the cosine retriever returns
EXPANSION_LIMIT = 20000 # most papers each expander appends
DEPTH = 4 # hops the decay terms reach
DECAY = 0.5 # weight kept per hop in the decay terms

# LeyLine Miner
[miner]
FOCUS = 4.0 # exponent on closeness when scoring an argued-with paper
WALK_PREFIX = 30 # head of the ranking the walks run on
CONNECTORS = 40 # most bridging papers kept
DECAY = 0.5 # weight kept per hop of a paper's reach
KNOCKDOWN = 0.4 # weight left on a paper once a line takes it
SEEDS = 10 # papers the walks start from
WALKS = 50 # walks per seed
BRANCH = 1 # papers a walk steps to at a time
ARGUES = ["extends", "critiques", "compares"] # intents that count as arguing with a paper
SUCCESSOR_DAYS = 240 # days before the cap a successor may date from
SUCCESSOR_FLOOR = 0.60 # lowest intent score a successor's citation needs

# LeyLine Intent Weights
[miner.weights]
extends = 1.0
critiques = 1.0
compares = 0.8
uses = 0.4
motivates = 0.15
background = 0.0

# Manager
[manager]
PORT = 6868 # port of the manager page
STATE_PATH = "data/manager" # jobs and cached charts
HF_TOKEN_PATH = "" # Hugging Face token file for publishing (empty means none)

# Export and Publishing
[export]
EXPORT_PATH = "data/export" # where dumps and releases are written
DATA_REPO = "kkuroma/GraphIV" # Hugging Face repo of the paper release
CITATION_REPO = "kkuroma/GraphIV-citation-intent" # Hugging Face repo of the intent labeler
SURVEY_REPO = "kkuroma/GraphIV-survey" # Hugging Face repo of the review classifier
BENCHMARK_REPO = "kkuroma/GraphIV_benchmarks" # Hugging Face repo of the benchmarks
QUERY_CACHE = "data/cache/queries" # benchmark questions cached by input

# Model Endpoints
[endpoints]
EMBEDDING_ENDPOINT = "http://127.0.0.1:11434/embedding/nomic-embed-text-v2-moe" # embedding endpoint
EMBEDDING_API_KEY = "" # embedding endpoint key (empty means none)
EMBEDDING_NAME = "nomic-embed-text-v2-moe" # embedding model
EMBEDDING_PARALLEL = 1 # embedding batches in flight
EMBEDDING_BATCH = 256 # papers per embedding batch
EMBEDDING_MAX_SEQ = 512 # token budget per document
EMBEDDING_DOCUMENT_PREFIX = "search_document: " # prefix on every embedded document
EMBEDDING_QUERY_PREFIX = "search_query: " # prefix on every embedded question
LLM_ENDPOINT = "http://localhost:11434/v1" # chat model endpoint
LLM_API_KEY = "" # chat model endpoint key (empty means none)
LLM_NAME = "Wordslop-Qwen3.6-27B" # chat model

# Review Classifier
[survey]
MODEL_PATH = "data/survey_detection" # classifier checkpoint
BATCH = 64 # papers per forward pass
CHUNK = 50000 # papers per commit

# UMAP Projection
[umap]
UMAP_MODEL_PATH = "data/umap_50.joblib" # fitted model
UMAP_SAMPLE = 400000 # papers the fit reads
UMAP_SEED = 69420 # random seed
UMAP_DIM = 50 # projected dimensions
UMAP_BATCH = 50000 # papers per transform batch
UMAP_WORKERS = 4 # transform processes

# Topic Tree
[topics]
TREE_METHODS = ["kmeans", "kmeans", "kmeans"] # clustering method per level
TREE_K = 16 # clusters per node
TREE_MIN_CLUSTER_SIZE = 60 # smallest cluster hdbscan keeps
TREE_N_PARALLEL = 8 # groups clustered at once
TREE_BATCH = 50000 # rows per write
TREE_SEED = 69420 # random seed
N_TOPIC_LABEL = 10 # papers shown to the namer per topic
TOPIC_BATCH = 8 # topics named at once

# Citation Labeler
[citation_labeler]
LABELER_PATH = "data/citation_labeler" # checkpoint directory
LABELER_MODEL = "distilbert/distilbert-base-uncased" # student base model
LABELER_BATCH = 48 # citations per forward pass
LABELER_MAX_SEQ = 256 # token budget per citation
LABELER_APE_MODEL = "Wordslop-Qwen3.6-27B" # teacher model
LABELER_APE_GENERATIONS = 6 # prompt search generations
LABELER_APE_PARALLEL = 4 # teacher calls in flight
LABELER_TEACHER_SAMPLE = 10000 # citations the teacher labels
LABELER_SEED = 0 # random seed
LABELER_SPLITS = [0.8, 0.1, 0.1] # train val and test shares
LABELER_EPOCHS = 12 # student training epochs
LABELER_TRAIN_BATCH = 64 # citations per training step
LABELER_LR = 2e-5 # student learning rate

# Review Case Selection
[surveymatch]
SURVEY_THRESHOLD = 0.5 # review score floor
MUTUAL_COSINE_THRESHOLD = 0.65 # closeness the reviews of one case share
SURVEYMATCH_LEVEL = 2 # tree level cases group by

# Benchmark Release
[benchmarks]
CUTOFF = "2026-10-22" # last day a mined review may carry
SURVEYMATCH_FLOOR = 100 # resolved references a SurveyMatch review needs
FRONTIERMATCH_FLOOR = 25 # resolved references a FrontierMatch review needs
CONSENSUSMATCH_FLOOR = 25 # resolved references a ConsensusMatch review needs
SURVEY_THRESHOLD = 0.95 # review classifier score a review needs
GAP_DAYS = 190 # widest gap between the reviews of one case
FRONTIER_COSINE = 0.80 # closeness the two FrontierMatch reviews need
FRONTIER_MIN_KEY = 10 # smallest FrontierMatch key
FRONTIER_WINDOW_DAYS = 730 # days before the earlier review an answer may date from
CONSENSUS_COSINE = 0.75 # closeness the ConsensusMatch reviews need
CONSENSUS_MIN_KEY = 5 # smallest ConsensusMatch key
